; main — the production BRAIN firmware for the dual-channel bench PSU.
;
; Built on top of the brain/UI-test project: it keeps the whole SSD1322 front-panel
; UI (readout + settings menus, rotary encoder, MCP23008 button expander) and adds
; the UART link to the two per-channel ATtiny1614 boards (see src/channel_link.*).
;
; The brain module is a Waveshare RP2350-Tiny (RP2350A, 4 MB flash, native USB).
; There is no dedicated RP2350-Tiny board file in platform-raspberrypi 1.17, so we
; use waveshare_rp2350_zero: same RP2350A silicon, same 4 MB flash, same USB stack.
;
; ── Pin map (RP2350) ───────────────────────────────────────────────────────────
; Front-panel OLED (SSD1322, hardware SPI1):
;   RES -> GPIO9   SCK -> GPIO10   MOSI -> GPIO11   DC -> GPIO12   CS -> GPIO13
; Rotary encoder (PIO quadrature):
;   A -> GPIO14    B -> GPIO15     PWR -> GPIO17
; MCP23008 button/buzzer expander (I2C1 = Wire1):
;   SDA -> GPIO6   SCL -> GPIO7    INT -> GPIO8
; Channel UART links (net names Tx_Chx/Rx_Chx in Control.kicad_sch):
;   CH1 = UART0 (Serial1):  Tx_Ch1 -> GPIO0   Rx_Ch1 -> GPIO1
;   CH2 = UART1 (Serial2):  Tx_Ch2 -> GPIO4   Rx_Ch2 -> GPIO5
; Both channel links run at 1 Mbps to match the ATtiny (config.h BRAIN_BAUD).

[env:waveshare_rp2350_zero]
platform = raspberrypi
board = waveshare_rp2350_zero
framework = arduino
monitor_speed = 115200
; protocol.h lives in include/ and is #included by the comms module.
build_flags = -I include
