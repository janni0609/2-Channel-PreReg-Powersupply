; UI-test — drive the front-panel SSD1322 256x64 OLED from the brain (RP2350-Tiny).
;
; The brain module is a Waveshare RP2350-Tiny (RP2350A, 4 MB flash, native USB).
; There is no dedicated RP2350-Tiny board file in platform-raspberrypi 1.17, so we
; use waveshare_rp2350_zero: same RP2350A silicon, same 4 MB flash, same USB stack.
; Only GPIO0..GPIO13 are used here, which exist identically on both modules.
;
; Display wiring (front-panel OLED connector J2 -> RP2350):
;   RES  -> GPIO9      RESET (manual GPIO)
;   SCK  -> GPIO10     SPI1 SCK   (hardware SPI1)
;   MOSI -> GPIO11     SPI1 TX    (hardware SPI1)
;   DC   -> GPIO12     data/command (manual GPIO)
;   CS   -> GPIO13     chip select  (manual GPIO)
; R/W and E/RD are tied on the OLED module for 4-wire SPI, so the MCU never drives them.
;
; Note: GPIO10/GPIO11 are the *SPI1* SCK/TX functions on the RP2350; they cannot be
; mapped to SPI0. The driver therefore uses the SPI1 peripheral instance.

[env:waveshare_rp2350_zero]
platform = raspberrypi
board = waveshare_rp2350_zero
framework = arduino
monitor_speed = 115200
