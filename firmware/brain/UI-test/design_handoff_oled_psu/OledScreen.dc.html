<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Chivo+Mono:wght@400;500;600&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/dseg7-classic/400.css" rel="stylesheet">
</helmet>
<div style="position:relative;width:256px;height:64px;background:#04070a;overflow:hidden;font-family:'Chivo Mono',ui-monospace,monospace;color:{{ col }};--nf:{{ nf }};">

  <!-- centre divider -->
  <div style="position:absolute;left:127px;top:7px;width:1px;height:50px;background:currentColor;opacity:.3;"></div>

  <!-- ===== CHANNEL 1 (constant-voltage) ===== -->
  <div style="position:absolute;left:0;top:0;width:128px;height:64px;box-sizing:border-box;padding:5px 8px 4px 8px;display:flex;flex-direction:column;justify-content:space-between;">

    <div style="display:flex;justify-content:space-between;align-items:center;font-size:8px;line-height:1;letter-spacing:.5px;">
      <span style="font-weight:600;">CH1</span>
      <span style="font-variant-numeric:tabular-nums;opacity:.85;"><span style="opacity:.6;">P </span>10.27<span style="opacity:.6;">W</span></span>
    </div>

    <div style="display:flex;align-items:baseline;justify-content:flex-end;gap:3px;line-height:1;">
      <span style="font-family:var(--nf);font-size:18px;letter-spacing:.5px;text-shadow:{{ glowShadow }};">12.472</span>
      <span style="font-size:9px;width:7px;opacity:.65;">V</span>
    </div>

    <div style="display:flex;align-items:baseline;justify-content:flex-end;gap:3px;line-height:1;">
      <span style="font-family:var(--nf);font-size:15px;letter-spacing:.5px;text-shadow:{{ glowShadow }};">0.8231</span>
      <span style="font-size:9px;width:7px;opacity:.65;">A</span>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;font-size:8px;line-height:1;letter-spacing:.3px;opacity:.7;padding-top:2px;border-top:1px solid currentColor;">
      <span style="opacity:.6;letter-spacing:.6px;">SET</span>
      <span style="font-variant-numeric:tabular-nums;">12.50<span style="opacity:.6;">V</span></span>
      <span style="font-variant-numeric:tabular-nums;">1.000<span style="opacity:.6;">A</span></span>
    </div>
  </div>

  <!-- ===== CHANNEL 2 (constant-current / at limit) ===== -->
  <div style="position:absolute;left:128px;top:0;width:128px;height:64px;box-sizing:border-box;padding:5px 8px 4px 9px;display:flex;flex-direction:column;justify-content:space-between;">

    <div style="display:flex;justify-content:space-between;align-items:center;font-size:8px;line-height:1;letter-spacing:.5px;">
      <span style="font-weight:600;">CH2</span>
      <span style="font-variant-numeric:tabular-nums;opacity:.85;"><span style="opacity:.6;">P </span>8.04<span style="opacity:.6;">W</span></span>
    </div>

    <div style="display:flex;align-items:baseline;justify-content:flex-end;gap:3px;line-height:1;">
      <span style="font-family:var(--nf);font-size:18px;letter-spacing:.5px;text-shadow:{{ glowShadow }};">4.021</span>
      <span style="font-size:9px;width:7px;opacity:.65;">V</span>
    </div>

    <div style="display:flex;align-items:baseline;justify-content:flex-end;gap:3px;line-height:1;">
      <span style="font-family:var(--nf);font-size:15px;letter-spacing:.5px;text-shadow:{{ glowShadow }};">2.0000</span>
      <span style="font-size:9px;width:7px;opacity:.65;">A</span>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;font-size:8px;line-height:1;letter-spacing:.3px;opacity:.7;padding-top:2px;border-top:1px solid currentColor;">
      <span style="opacity:.6;letter-spacing:.6px;">SET</span>
      <span style="font-variant-numeric:tabular-nums;">5.00<span style="opacity:.6;">V</span></span>
      <span style="font-variant-numeric:tabular-nums;">2.000<span style="opacity:.6;">A</span></span>
    </div>
  </div>

  <!-- pixel-matrix overlay -->
  <div style="position:absolute;inset:0;pointer-events:none;z-index:9;background:{{ gridBg }};background-size:1px 1px;"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: 256, &quot;height&quot;: 64},
  &quot;font&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;'Chivo Mono', ui-monospace, monospace&quot;, &quot;tsType&quot;: &quot;string&quot;},
  &quot;tint&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#54e0ff&quot;, &quot;options&quot;: [&quot;#54e0ff&quot;, &quot;#eaf6ff&quot;, &quot;#ffb347&quot;], &quot;tsType&quot;: &quot;string&quot;},
  &quot;glow&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 3, &quot;min&quot;: 0, &quot;max&quot;: 6, &quot;step&quot;: 1, &quot;unit&quot;: &quot;px&quot;, &quot;tsType&quot;: &quot;number&quot;},
  &quot;grid&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}
}">
class Component extends DCLogic {
  renderVals() {
    const col = this.props.tint || '#54e0ff';
    const glowPx = this.props.glow ?? 3;
    const nf = this.props.font || "'Chivo Mono', ui-monospace, monospace";
    const gridOn = this.props.grid ?? false;
    return {
      col,
      nf,
      glowShadow: glowPx > 0 ? `0 0 ${glowPx}px ${col}` : 'none',
      gridBg: gridOn
        ? 'linear-gradient(rgba(0,0,0,.5) 0.4px, transparent 0.4px), linear-gradient(90deg, rgba(0,0,0,.5) 0.4px, transparent 0.4px)'
        : 'none'
    };
  }
}
</script>
</body>
</html>
